[app]
name = "gitea"
image = "docker.io/gitea/gitea:1.22.6-rootless@sha256:4216d612992a25ed5fe6062679ca0be0b224f93c0b6fdba03e6c8f3d623cfb4e"
http = { port = 3000, health = "/api/healthz" }
state = { dirs = ["."], mount = "/var/lib/gitea", snapshot = "nightly" }
auth = { passkey = true, header = "X-WEBAUTH-USER" }
limits = { cpu = "100%", mem = "1G" }
skill = "Gitea. API at /api/v1. Admin token is in keys as gitea/admin."
env = { GITEA_APP_INI = "/var/lib/gitea/custom/conf/app.ini", GITEA__security__INSTALL_LOCK = "true", GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION = "true", GITEA__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = "true", GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES = "*", GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API = "true", GITEA__server__ROOT_URL = "http://localhost/", GITEA__database__DB_TYPE = "sqlite3", GITEA__repository__ENABLE_PUSH_CREATE_USER = "true" }
