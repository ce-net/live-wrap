[package]
name = "wrap"
description = "ce wrap: a catalog entry per app, passkey forward-auth in front (default deny), snapshot and restore of its state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ce-wrap"
path = "src/main.rs"

[dependencies]
# live-shop (public, Apache-2.0): ed25519 capability chains, used here for sessions and snapshot seals
shop-chain = { git = "https://github.com/ce-net/live-shop", rev = "30f0afa84711167b47f71c40a79931f4d2357e54" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }
shop-chain = { git = "https://github.com/ce-net/live-shop", rev = "30f0afa84711167b47f71c40a79931f4d2357e54" }
